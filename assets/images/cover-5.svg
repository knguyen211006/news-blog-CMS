<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
  <title>Bảng kiểm tra khả năng đọc, sửa lỗi font tiếng Việt và độ tương phản trên Góc Nhìn</title>
  <rect width="1280" height="720" fill="#F5F2EB"/>
  <!-- Top Header -->
  <rect x="44" y="32" width="1192" height="58" rx="8" fill="#141413"/>
  <text x="72" y="68" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="19" font-weight="700" fill="#FAF7F2">NHẬT KÝ KIỂM THỬ GIAO DIỆN GÓC NHÌN · KHẢ NĂNG ĐỌC &amp; ĐỘ TƯƠNG PHẢN THỰC TẾ</text>
  <rect x="1030" y="45" width="186" height="32" rx="16" fill="#B84227"/>
  <text x="1123" y="66" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">320px → 1440px</text>

  <!-- LEFT COLUMN: BEFORE (PROBLEMS FOUND ON XAMPP) -->
  <g>
    <rect x="44" y="114" width="576" height="562" rx="12" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
    <rect x="44" y="114" width="576" height="46" rx="12" fill="#FFE4E6"/>
    <text x="70" y="143" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="15" font-weight="700" fill="#9F1239">✕ TRƯỚC KHI SỬA (PHÁT HIỆN TRÊN TRÌNH DUYỆT WINDOWS)</text>

    <!-- Issue 1: Broken Vietnamese Diacritics -->
    <rect x="68" y="182" width="528" height="134" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5"/>
    <text x="88" y="208" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#BE123C">1. Lỗi tách dấu tiếng Việt khi dùng font Cambria / Georgia:</text>
    <text x="88" y="246" font-family="'Times New Roman', serif" font-size="25" font-weight="700" fill="#1E293B">“Những góc xanh được vun trô&#160;&#768;ng”</text>
    <text x="88" y="280" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" fill="#881337">→ Thiếu glyph Unicode tổ hợp (U+1EA0–U+1EF9) làm hở khoảng trắng sau nguyên âm.</text>

    <!-- Issue 2: Low Contrast in Light Mode -->
    <rect x="68" y="334" width="528" height="145" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5"/>
    <text x="88" y="362" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#BE123C">2. Tương phản nhãn trạng thái ở Chế độ Sáng dưới ngưỡng 4.5:1:</text>
    <rect x="88" y="380" width="110" height="34" rx="6" fill="#FEF3C7"/>
    <text x="143" y="402" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309">Chờ duyệt</text>
    <text x="216" y="402" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#E11D48">Đo thực tế: 4.12 : 1 (Thấp hơn chuẩn 4.5:1)</text>
    <text x="88" y="446" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" fill="#881337">→ Người đọc dưới ánh sáng mạnh khó phân biệt nhãn trạng thái trong bảng.</text>

    <!-- Issue 3: Mobile 320px Nav Crowding -->
    <rect x="68" y="497" width="528" height="154" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5"/>
    <text x="88" y="525" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#BE123C">3. Thanh Tòa soạn ở màn hình điện thoại 320px:</text>
    <text x="88" y="555" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13.5" fill="#334155">Hiển thị dàn trải 8 liên kết quản trị làm chữ bị ép hẹp hoặc đẩy nội dung</text>
    <text x="88" y="578" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13.5" fill="#334155">chính xuống quá sâu, phải cuộn nhiều mới tới khu vực viết bài.</text>
    <text x="88" y="618" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#9F1239">→ Cần gộp vào menu Tòa soạn gọn gàng và giữ nút + Viết bài nổi bật.</text>
  </g>

  <!-- RIGHT COLUMN: AFTER (VERIFIED SOLUTION) -->
  <g>
    <rect x="660" y="114" width="576" height="562" rx="12" fill="#FFFFFF" stroke="#047857" stroke-width="2.5"/>
    <rect x="660" y="114" width="576" height="46" rx="12" fill="#DCFCE7"/>
    <text x="686" y="143" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="15" font-weight="700" fill="#065F46">✓ SAU KHI TINH CHỈNH (ĐẠT CHUẨN ĐỌC &amp; WCAG AA)</text>

    <!-- Fix 1: Clean Vietnamese Typography -->
    <rect x="684" y="182" width="528" height="134" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <text x="704" y="208" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#065F46">1. Bộ font hệ thống hỗ trợ 100% dấu tiếng Việt + độ rộng 68ch:</text>
    <text x="704" y="246" font-family="'Palatino Linotype', 'Times New Roman', serif" font-size="25" font-weight="700" fill="#141413">“Những góc xanh được vun trồng”</text>
    <text x="704" y="280" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" fill="#166534">→ Chữ liền mạch, nội dung bài viết dùng cỡ 17px, khoảng cách dòng 1.85 dịu mắt.</text>

    <!-- Fix 2: High Contrast Badges -->
    <rect x="684" y="334" width="528" height="145" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <text x="704" y="362" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#065F46">2. Nhãn trạng thái đạt độ tương phản ≥ 6.5 : 1 trên cả Sáng &amp; Tối:</text>
    <rect x="704" y="380" width="104" height="34" rx="6" fill="#EFE4D8" stroke="#78350F" stroke-width="1"/>
    <text x="756" y="402" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#78350F">Chờ duyệt</text>
    <rect x="822" y="380" width="114" height="34" rx="6" fill="#E0EFEA" stroke="#065F46" stroke-width="1"/>
    <text x="879" y="402" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#065F46">Đã xuất bản</text>
    <text x="952" y="402" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#065F46">Đo đạt: 6.56 – 7.68 : 1 ✓</text>
    <text x="704" y="446" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" fill="#166534">→ Lưu chế độ Sáng/Tối bền vững trong localStorage mà không vi phạm CSP.</text>

    <!-- Fix 3: Compact Mobile Workspace Menu -->
    <rect x="684" y="497" width="528" height="154" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <text x="704" y="525" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" font-weight="700" fill="#065F46">3. Thanh Tòa soạn thu gọn trên điện thoại 320px:</text>
    <!-- Simulated 320px bar -->
    <rect x="704" y="542" width="340" height="50" rx="8" fill="#FAF7F2" stroke="#D6CFC2" stroke-width="1.5"/>
    <rect x="714" y="551" width="155" height="32" rx="6" fill="#FFFFFF" stroke="#524D46" stroke-width="1"/>
    <text x="791" y="572" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#141413">☰ Menu Tòa soạn ▾</text>
    <rect x="928" y="551" width="104" height="32" rx="6" fill="#9A3019"/>
    <text x="980" y="572" text-anchor="middle" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">+ Viết bài</text>
    <text x="704" y="624" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="13" fill="#166534">→ Gộp gọn 7 mục quản trị vào 1 nút mở, giữ nút + Viết bài luôn trong tầm tay.</text>
  </g>
</svg>
